<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Verification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background-color: #f8f9fa; color: #333; text-align: center; padding: 20px;
    }
    .card {
      background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%;
    }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .spinner {
      border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div id="status">
    <div class="spinner"></div>
    <h3>Verifying Attendance Token...</h3>
  </div>
</div>

<script>
  // 1. Paste your Google Form pre-fill URL here (ending in entry.XXXXXX=)
  const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfU1FZt2tQKfBgyZsL6NRzpJ9nw0REMHibGThSZROMFXaGckw/viewform?usp=pp_url&entry.610762855=";

  // 2. Maximum age allowed for the QR scan in seconds (e.g., 15s)
  const MAX_ALLOWED_AGE_SECONDS = 15;

  function verifyScan() {
    const params = new URLSearchParams(window.location.search);
    const tokenTime = parseInt(params.get("t"), 10);
    const currentTime = Date.now();

    const statusDiv = document.getElementById("status");

    // Check if token exists in URL
    if (!tokenTime || isNaN(tokenTime)) {
      statusDiv.innerHTML = `<h2 class="error">❌ Invalid Request</h2><p>No valid security token found.</p>`;
      return;
    }

    // Calculate age in seconds
    const ageInSeconds = (currentTime - tokenTime) / 1000;

    // Check if token is within allowed scan window
    if (ageInSeconds <= MAX_ALLOWED_AGE_SECONDS) {
      statusDiv.innerHTML = `<h2 class="success">✅ Verification Successful!</h2><p>Redirecting to Attendance Form...</p>`;
      
      // Pass a "VERIFIED" timestamp to the Google Form so you know they passed the gate
      const redirectUrl = GOOGLE_FORM_URL + "VERIFIED_" + tokenTime;

      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 1000);
    } else {
      // Failed verification (Screenshot / Shared Link)
      statusDiv.innerHTML = `
        <h2 class="error">❌ QR Code Expired</h2>
        <p>This QR code was scanned too late or was forwarded via screenshot.</p>
        <p><strong>Please scan the live code on the screen directly.</strong></p>
      `;
    }
  }

  verifyScan();
</script>

</body>
</html>
